<style>
:root {
  --paper: #f6f3ee;
  --ink: #141414;
  --mute: #7a746b;
  --line: #ddd6ca;
  --gold: #a8875a;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121110; --ink: #eee8dd; --mute: #9b9387; --line: #2e2b27; --gold: #c9a874; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: "Jost", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 600px; margin: 0 auto; padding: 72px 24px 48px; }
header { text-align: center; padding-bottom: 40px; }
.mono { width: 104px; height: 104px; display: block; margin: 0 auto 26px; color: var(--ink); }
.mono path[fill="#1a1a1a"] { fill: var(--ink); }
.kicker {
  font-size: 11px; letter-spacing: .42em; text-transform: uppercase; color: var(--gold);
}
h1 {
  margin-top: 10px;
  font-family: "Bodoni Moda", "Bodoni MT", Didot, serif;
  font-weight: 400; font-style: italic; font-size: 46px; letter-spacing: .01em;
}
.rule { display: flex; align-items: center; gap: 14px; justify-content: center; margin-top: 22px; }
.rule::before, .rule::after { content: ""; width: 72px; height: 1px; background: var(--gold); opacity: .7; }
.rule span { width: 5px; height: 5px; transform: rotate(45deg); border: 1px solid var(--gold); }
ol { list-style: none; border-top: 1px solid var(--line); }
li { border-bottom: 1px solid var(--line); }
a {
  display: grid;
  grid-template-columns: 34px 30px 1fr 40px;
  column-gap: 18px;
  align-items: center;
  padding: 24px 6px;
  color: inherit;
  text-decoration: none;
  transition: background .35s ease;
}
.no {
  font-family: "Bodoni Moda", "Bodoni MT", serif; font-style: italic;
  font-size: 18px; color: var(--gold);
}
.icon { width: 30px; height: 30px; color: var(--ink); transition: color .35s ease; }
.en {
  display: block; font-size: 10.5px; letter-spacing: .32em; text-transform: uppercase; color: var(--mute);
}
.name {
  display: block; margin-top: 3px;
  font-family: "Noto Serif TC", "PMingLiU", serif; font-weight: 600;
  font-size: 23px; letter-spacing: .06em;
}
.desc { display: block; margin-top: 4px; font-size: 13.5px; line-height: 1.6; color: var(--mute); }
.go { justify-self: end; position: relative; width: 22px; height: 1px; background: var(--mute);
  transition: width .35s ease, background .35s ease; }
.go::after { content: ""; position: absolute; right: 0; top: -3px; width: 7px; height: 7px;
  border-top: 1px solid currentColor; border-right: 1px solid currentColor; transform: rotate(45deg);
  color: var(--mute); transition: color .35s ease; }
a:hover, a:focus-visible { background: color-mix(in srgb, var(--gold) 7%, transparent); }
a:hover .icon, a:focus-visible .icon { color: var(--gold); }
a:hover .go, a:focus-visible .go { width: 36px; background: var(--gold); }
a:hover .go::after, a:focus-visible .go::after { color: var(--gold); }
a:focus-visible { outline: 1px solid var(--gold); outline-offset: 2px; }
footer {
  margin-top: 40px; text-align: center;
  font-family: "Bodoni Moda", "Bodoni MT", serif; font-style: italic; font-size: 14px; color: var(--mute);
}
/* motion: the monogram rings draw in, the header rises, rows slide in one by one */
.mono path[stroke] { stroke-dasharray:460; stroke-dashoffset:460; animation:draw 2.2s ease .2s forwards; }
.mono path[fill="#1a1a1a"] { opacity:0; animation:fade 1.4s ease 1s forwards; }
header .kicker, header h1, header .rule { opacity:0; animation:rise 1s ease forwards; }
header .kicker { animation-delay:.9s; } header h1 { animation-delay:1.1s; } header .rule { animation-delay:1.3s; }
li { opacity:0; animation:slide .8s ease forwards; }
li:nth-child(1) { animation-delay:1.52s; } li:nth-child(2) { animation-delay:1.64s; } li:nth-child(3) { animation-delay:1.76s; } li:nth-child(4) { animation-delay:1.88s; } li:nth-child(5) { animation-delay:2.00s; } li:nth-child(6) { animation-delay:2.12s; } 
.rule span { animation:spin 9s linear infinite; }
@keyframes draw { to { stroke-dashoffset:0; } }
@keyframes fade { to { opacity:1; } }
@keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
@keyframes slide { from { opacity:0; transform:translateX(-14px); } to { opacity:1; transform:none; } }
@keyframes spin { from { transform:rotate(45deg); } to { transform:rotate(405deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; opacity:1 !important; stroke-dashoffset:0 !important; } }
@media (max-width: 480px) {
  main { padding: 52px 18px 36px; }
  h1 { font-size: 38px; }
  a { grid-template-columns: 26px 26px 1fr 24px; column-gap: 12px; padding: 20px 2px; }
  .icon { width: 26px; height: 26px; }
  .name { font-size: 20px; }
  .go { width: 16px; }
  a:hover .go { width: 22px; }
}
</style>
